name: Python CI
on:
  push:
    branches: [main]
    paths: ['**/*.py','requirements.txt','data/**','tests/**','.github/workflows/backend-ci.yml']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q api.py src scripts
      - name: Unit and governance tests
        run: pytest -q
      - name: Reproducible evaluation
        run: python scripts/evaluate.py
      - name: FastAPI smoke
        run: |
          uvicorn api:app --host 127.0.0.1 --port 8000 >/tmp/regops-api.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          python - <<'PY'
          import json,time,urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health') as r:
                      assert json.load(r)['paid_api_required'] is False
                  break
              except Exception: time.sleep(.25)
          else: raise SystemExit('API did not start')
          PY
      - name: Docker build
        run: docker build -t regops-eu .
